services:
  db:
    build: ./docker/db
    image: sg-events-db:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgevents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgevents}
      POSTGRES_DB: ${POSTGRES_DB:-sgevents}
      TZ: UTC  # store UTC; the app renders Asia/Singapore
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-run init a temporary socket-only server is up,
      # and we only want "healthy" once the real server accepts network connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
