[project]
name = "sg-events-backend"
version = "0.1.0"
description = "SG Events Tracker backend: source adapters, pipeline and FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dateparser>=1.4.3",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
